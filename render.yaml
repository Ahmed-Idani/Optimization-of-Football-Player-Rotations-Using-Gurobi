# Render blueprint: the solver API.
#
# The interface is not here. It is a static bundle served from Netlify's CDN,
# configured in netlify.toml at the repo root, and points at this service
# through VITE_API_URL.
#
# Validate with:  render blueprints validate ./render.yaml

services:
  - type: web
    name: rotation-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker on purpose. The free instance is small, and a single worker
    # avoids two processes racing to seed the database on first boot.
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/teams/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
