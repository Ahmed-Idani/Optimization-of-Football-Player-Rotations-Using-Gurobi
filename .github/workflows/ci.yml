name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch is of no interest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The import-casing bug that broke this build only showed on a
      # case-sensitive filesystem. Catch that class of error explicitly.
      - name: Check import casing resolves
        run: |
          test -d dist/assets || { echo "no build output"; exit 1; }
          echo "build output present"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Seed and solve
        # Imports the app the way gunicorn does, then checks every club seeds
        # with a full squad and returns an optimal rotation.
        run: |
          python - <<'PY'
          import json
          import main
          from config import app

          client = app.test_client()

          teams = client.get("/api/teams/").get_json()["teams"]
          assert len(teams) == 10, f"expected 10 clubs, got {len(teams)}"

          payload = {
              "numberMatches": 5,
              "matchesChosen": {
                  str(i): {"opponent": f"Opp{i}", "difficulty": d}
                  for i, d in enumerate([1.5, 0.5, 1.0, 1.5, 0.5])
              },
          }

          for team in teams:
              name = team["team_name"]
              players = client.get(
                  f"/api/teams/{name}/players/").get_json()["players"]
              assert len(players) == 6, f"{name}: {len(players)} players, expected 6"

              result = client.post(
                  f"/api/optimise/{name}/", json=payload).get_json()
              assert "total_goals" in result, f"{name} failed: {result}"
              print(f"  {name:16} 6 players, {result['total_goals']:.2f} goals")

          print(f"\n{len(teams)} clubs seeded and solved")
          PY

  assets:
    name: Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every referenced image exists
        # Guards against the orphaned-path and case-collision problems that
        # have bitten this repo before.
        run: |
          python - <<'PY'
          import csv, sys
          from pathlib import Path

          public = Path("frontend/public")
          missing = []
          seen_lower = {}
          for source in ("backend/players_scaffold.csv",
                         "backend/players_retired.csv"):
              for row in csv.DictReader(open(source, encoding="utf-8")):
                  path = (row.get("image_path") or "").strip()
                  if path and not (public / path.lstrip("/")).exists():
                      missing.append(f"{row['player_name']}: {path}")

          for path in public.rglob("*"):
              key = str(path).lower()
              if key in seen_lower and str(path) != seen_lower[key]:
                  missing.append(f"case collision: {path} vs {seen_lower[key]}")
              seen_lower[key] = str(path)

          if missing:
              print("\n".join(missing))
              sys.exit(1)
          print("all referenced images present, no case collisions")
          PY
